name: fable

x-backend: &backend
  image: fable-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fable}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fable}
    STORY_PROVIDER: ${STORY_PROVIDER:-deepseek}
    STORY_GENERATION_MAX_ATTEMPTS: ${STORY_GENERATION_MAX_ATTEMPTS:-2}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek/deepseek-v4.1-flash}
    DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-120}
    DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-8192}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
    GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS:-8192}
  init: true
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fable}
      POSTGRES_USER: ${POSTGRES_USER:-fable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *backend
    # Migrations do not need model-provider credentials.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fable}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fable}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    image: fable-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
